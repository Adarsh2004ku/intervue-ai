version: '3.9'

services:

  api:
    build: .

    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - redis

    environment:
      REDIS_URL: redis://redis:6379

    volumes:
      - .:/app

    command: >
      uvicorn backend.main:app
      --host 0.0.0.0
      --port 8000
      --reload


  redis:
    image: redis:7-alpine

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes


volumes:
  redis_data: